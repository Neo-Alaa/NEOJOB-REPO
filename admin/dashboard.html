<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord admin — NeoJob</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet">
<script>try{if(localStorage.getItem("neojob_theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
</head>
<body>
<div class="bg-ambient"></div>

<header id="site-header"></header>

<div class="d-flex">
  <aside id="site-sidebar" style="width:250px;" class="d-none d-lg-block flex-shrink-0"></aside>

  <main class="flex-grow-1 p-3 p-lg-5" style="min-width:0;">
    <button class="btn btn-neo-outline btn-sm d-lg-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
      <i class="bi bi-list me-1"></i> Menu
    </button>

    <div class="mb-4">
      <h1 class="h4 mb-1">Tableau de bord administrateur</h1>
      <p class="text-muted-soft mb-0">Vue d'ensemble de la plateforme NeoJob.</p>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3">
        <div class="stat-tile">
          <div class="text-muted-soft small mb-1"><i class="bi bi-people me-1"></i> Utilisateurs</div>
          <div class="stat-value" id="stat-users">0</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-tile">
          <div class="text-muted-soft small mb-1"><i class="bi bi-building me-1"></i> Entreprises</div>
          <div class="stat-value" id="stat-companies">0</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-tile">
          <div class="text-muted-soft small mb-1"><i class="bi bi-briefcase me-1"></i> Offres publiées</div>
          <div class="stat-value" id="stat-jobs">0</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-tile">
          <div class="text-muted-soft small mb-1" style="color:var(--orange) !important;"><i class="bi bi-hourglass-split me-1"></i> En modération</div>
          <div class="stat-value" id="stat-pending">0</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-tile">
          <div class="text-muted-soft small mb-1" style="color:var(--mint) !important;"><i class="bi bi-cash-coin me-1"></i> Revenus</div>
          <div class="stat-value" id="stat-revenue">0 MAD</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-tile">
          <div class="text-muted-soft small mb-1" style="color:var(--violet) !important;"><i class="bi bi-stars me-1"></i> Comptes Premium</div>
          <div class="stat-value" id="stat-premium">0</div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="panel p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0">Offres en attente de modération</h6>
            <a href="moderation.html" class="text-muted-soft small">Voir tout <i class="bi bi-arrow-right"></i></a>
          </div>
          <div class="table-responsive">
            <table class="table table-neo mb-0">
              <thead><tr><th>Offre</th><th>Entreprise</th><th>Date</th></tr></thead>
              <tbody id="pending-jobs-body"></tbody>
            </table>
          </div>
          <div id="pending-jobs-empty" style="display:none;"></div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="panel p-4">
          <h6 class="mb-3">Répartition des utilisateurs</h6>
          <div class="d-flex flex-column gap-3" id="role-breakdown"></div>
        </div>
      </div>
    </div>

    <div class="panel p-4 mt-4">
      <h6 class="mb-3">Offres publiées par catégorie</h6>
      <div style="height:220px;">
        <canvas id="category-chart"></canvas>
      </div>
    </div>
  </main>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" style="background:var(--bg-panel); width:260px;">
  <div class="offcanvas-header">
    <span class="fw-semibold">Menu</span>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fermer"></button>
  </div>
  <div class="offcanvas-body pt-0" id="site-sidebar-mobile"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../assets/js/pages/admin-dashboard.js"></script>
</body>
</html>
