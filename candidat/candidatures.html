<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes candidatures — NeoJob</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet">
<script>try{if(localStorage.getItem("neojob_theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
</head>
<body>
<div class="bg-ambient"></div>

<header id="site-header"></header>

<div class="d-flex">
  <aside id="site-sidebar" style="width:250px;" class="d-none d-lg-block flex-shrink-0"></aside>

  <main class="flex-grow-1 p-3 p-lg-5" style="min-width:0;">
    <button class="btn btn-neo-outline btn-sm d-lg-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
      <i class="bi bi-list me-1"></i> Menu
    </button>

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
      <div>
        <h1 class="h4 mb-1">Mes candidatures</h1>
        <p class="text-muted-soft mb-0">Suivez le statut de toutes vos candidatures envoyées.</p>
      </div>
      <select id="status-filter" class="form-select form-select-sm" style="width:auto;">
        <option value="">Tous les statuts</option>
        <option value="en_attente">Reçue</option>
        <option value="preselection">Présélection</option>
        <option value="entretien">Entretien</option>
        <option value="offre">Offre envoyée</option>
        <option value="embauchee">Embauché(e)</option>
        <option value="refusee">Refusée</option>
      </select>
    </div>

    <div class="panel p-4">
      <div class="table-responsive">
        <table class="table table-neo mb-0">
          <thead><tr><th>Offre</th><th>Entreprise</th><th>Date de candidature</th><th>Statut</th><th>Entretien</th><th></th><th></th></tr></thead>
          <tbody id="applications-body"></tbody>
        </table>
      </div>
      <div id="applications-empty" style="display:none;"></div>
    </div>
  </main>
</div>

<!-- Interview slot picker -->
<div class="modal fade" id="slotModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content panel border-0">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title">Choisir un créneau d'entretien</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body p-4">
        <p class="text-muted-soft small mb-3" id="slot-modal-meta"></p>
        <div class="d-flex flex-column gap-2" id="slot-modal-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- Message thread -->
<div class="modal fade" id="messageModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content panel border-0">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title">Messages — <span id="message-modal-job"></span></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body p-4">
        <div id="messages-thread" class="mb-2" style="max-height:280px; overflow-y:auto;"></div>
        <div class="input-group">
          <textarea class="form-control" id="message-input" rows="1" placeholder="Écrire un message au recruteur..."></textarea>
          <button type="button" class="btn btn-neo-primary" id="message-send-btn"><i class="bi bi-send"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" style="background:var(--bg-panel); width:260px;">
  <div class="offcanvas-header">
    <span class="fw-semibold">Menu</span>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fermer"></button>
  </div>
  <div class="offcanvas-body pt-0" id="site-sidebar-mobile"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/pages/candidat-candidatures.js"></script>
</body>
</html>
