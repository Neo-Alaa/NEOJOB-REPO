<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord recruteur — NeoJob</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet">
<script>try{if(localStorage.getItem("neojob_theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
</head>
<body>
<div class="bg-ambient"></div>

<header id="site-header"></header>

<div class="d-flex">
  <aside id="site-sidebar" style="width:250px;" class="d-none d-lg-block flex-shrink-0"></aside>

  <main class="flex-grow-1 p-3 p-lg-5" style="min-width:0;">
    <button class="btn btn-neo-outline btn-sm d-lg-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
      <i class="bi bi-list me-1"></i> Menu
    </button>

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
      <div>
        <h1 class="h4 mb-1">Bonjour <span id="welcome-name">👋</span></h1>
        <p class="text-muted-soft mb-0 d-flex align-items-center gap-2 flex-wrap">
          Voici un aperçu de votre activité de recrutement.
          <a href="../tarifs.html" class="pill" id="plan-badge">--</a>
        </p>
      </div>
      <a href="poster-offre.html" class="btn btn-neo-primary btn-sm"><i class="bi bi-plus-lg me-1"></i> Publier une offre</a>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3">
        <div class="stat-tile">
          <div class="text-muted-soft small mb-1"><i class="bi bi-briefcase me-1"></i> Offres publiées</div>
          <div class="stat-value" id="stat-published">0</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-tile">
          <div class="text-muted-soft small mb-1" style="color:var(--orange) !important;"><i class="bi bi-hourglass-split me-1"></i> En modération</div>
          <div class="stat-value" id="stat-pending">0</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-tile">
          <div class="text-muted-soft small mb-1"><i class="bi bi-inbox me-1"></i> Candidatures reçues</div>
          <div class="stat-value" id="stat-applications">0</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-tile">
          <div class="text-muted-soft small mb-1" style="color:var(--mint) !important;"><i class="bi bi-check-circle me-1"></i> Embauché(e)s</div>
          <div class="stat-value" id="stat-accepted">0</div>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-lg-8">
        <div class="panel p-4 h-100">
          <h6 class="mb-3">Candidatures reçues (8 dernières semaines)</h6>
          <div style="height:220px;">
            <canvas id="applications-chart"></canvas>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="panel p-4 mb-3">
          <div id="completion-widget"></div>
        </div>
        <div class="panel p-4">
          <h6 class="mb-3">Badges</h6>
          <div class="d-flex flex-wrap gap-2" id="badges-container"></div>
        </div>
      </div>
    </div>

    <div class="panel p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="mb-0">Candidatures récentes</h6>
        <a href="candidatures-recues.html" class="text-muted-soft small">Voir tout <i class="bi bi-arrow-right"></i></a>
      </div>
      <div class="table-responsive">
        <table class="table table-neo mb-0">
          <thead><tr><th>Candidat</th><th>Offre</th><th>Date</th><th>Statut</th></tr></thead>
          <tbody id="recent-applications-body"></tbody>
        </table>
      </div>
      <div id="recent-applications-empty" style="display:none;"></div>
    </div>
  </main>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" style="background:var(--bg-panel); width:260px;">
  <div class="offcanvas-header">
    <span class="fw-semibold">Menu</span>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fermer"></button>
  </div>
  <div class="offcanvas-body pt-0" id="site-sidebar-mobile"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../assets/js/pages/recruteur-dashboard.js"></script>
</body>
</html>
