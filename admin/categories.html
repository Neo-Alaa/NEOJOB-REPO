<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catégories — NeoJob</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet">
<script>try{if(localStorage.getItem("neojob_theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
</head>
<body>
<div class="bg-ambient"></div>

<header id="site-header"></header>

<div class="d-flex">
  <aside id="site-sidebar" style="width:250px;" class="d-none d-lg-block flex-shrink-0"></aside>

  <main class="flex-grow-1 p-3 p-lg-5" style="min-width:0;">
    <button class="btn btn-neo-outline btn-sm d-lg-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
      <i class="bi bi-list me-1"></i> Menu
    </button>

    <div class="mb-4">
      <h1 class="h4 mb-1">Catégories</h1>
      <p class="text-muted-soft mb-0">Gérez les catégories utilisées pour classer les offres d'emploi.</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="panel p-4">
          <h6 class="mb-3" id="form-title">Ajouter une catégorie</h6>
          <form id="category-form">
            <input type="hidden" id="cat-id">
            <div class="mb-3">
              <label class="form-label">Nom de la catégorie</label>
              <input type="text" class="form-control" id="cat-nom" placeholder="Ex: Développement Mobile" required>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-neo-primary btn-sm" id="cat-submit-btn">Ajouter</button>
              <button type="button" class="btn btn-neo-ghost btn-sm" id="cat-cancel-btn" style="display:none;">Annuler</button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="panel p-4">
          <div class="table-responsive">
            <table class="table table-neo mb-0">
              <thead><tr><th>Nom</th><th>Offres liées</th><th></th></tr></thead>
              <tbody id="categories-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" style="background:var(--bg-panel); width:260px;">
  <div class="offcanvas-header">
    <span class="fw-semibold">Menu</span>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fermer"></button>
  </div>
  <div class="offcanvas-body pt-0" id="site-sidebar-mobile"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/pages/admin-categories.js"></script>
</body>
</html>
