<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offres d'emploi — NeoJob</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/theme.css" rel="stylesheet">
<script>try{if(localStorage.getItem("neojob_theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
</head>
<body>
<div class="bg-ambient"></div>

<header id="site-header"></header>

<main>
  <section class="py-4">
    <div class="container">
      <h1 class="h3 mb-1">Toutes les offres</h1>
      <p class="text-muted-soft mb-0">Filtrez par mot-clé, ville, catégorie ou type de contrat.</p>
    </div>
  </section>

  <section class="pb-5">
    <div class="container">
      <div class="row g-4">

        <!-- Filters -->
        <div class="col-lg-3">
          <div class="panel p-4 sticky-top" style="top:92px;">
            <h6 class="mb-3 d-flex align-items-center gap-2"><i class="bi bi-sliders"></i> Filtres</h6>
            <form id="filters-form" onsubmit="return false;">
              <div class="mb-3">
                <label class="form-label">Mot-clé</label>
                <div class="input-icon-group">
                  <i class="bi bi-search"></i>
                  <input type="text" id="f-q" class="form-control" placeholder="Titre, compétence...">
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Ville</label>
                <div class="input-icon-group">
                  <i class="bi bi-geo-alt"></i>
                  <input type="text" id="f-ville" class="form-control" placeholder="Casablanca, Rabat...">
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Catégorie</label>
                <select id="f-categorie" class="form-select">
                  <option value="">Toutes les catégories</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Type de contrat</label>
                <select id="f-contrat" class="form-select">
                  <option value="">Tous les types</option>
                  <option value="CDI">CDI</option>
                  <option value="CDD">CDD</option>
                  <option value="Stage">Stage</option>
                  <option value="Freelance">Freelance</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Compétence</label>
                <select id="f-competence" class="form-select">
                  <option value="">Toutes les compétences</option>
                </select>
              </div>
              <div class="mb-4 form-check ps-0">
                <div class="d-flex align-items-center gap-2">
                  <input class="form-check-input ms-0" type="checkbox" id="f-remote" style="width:2.2em;height:1.2em;">
                  <label class="form-check-label small text-muted-soft" for="f-remote">Télétravail uniquement</label>
                </div>
              </div>
              <button type="button" id="f-reset" class="btn btn-neo-outline btn-sm w-100">
                <i class="bi bi-arrow-counterclockwise me-1"></i> Réinitialiser
              </button>
              <button type="button" id="create-alert-btn" class="btn btn-neo-primary btn-sm w-100 mt-2">
                <i class="bi bi-bell-fill me-1"></i> Créer une alerte
              </button>
            </form>
          </div>
        </div>

        <!-- Results -->
        <div class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <span class="text-muted-soft small" id="results-count">-- résultats</span>
            <select id="f-sort" class="form-select form-select-sm" style="width:auto;">
              <option value="recent">Plus récentes</option>
              <option value="salaire-desc">Salaire décroissant</option>
              <option value="salaire-asc">Salaire croissant</option>
            </select>
          </div>

          <div class="row g-4" id="jobs-container">
            <div class="col-12"><div class="skeleton" style="height:180px;"></div></div>
          </div>

          <nav class="mt-4 d-flex justify-content-center">
            <ul class="pagination" id="pagination-container"></ul>
          </nav>
        </div>

      </div>
    </div>
  </section>
</main>

<!-- Compare floating bar -->
<div class="compare-bar" id="compare-bar">
  <span class="small" id="compare-count">0 offre sélectionnée</span>
  <button type="button" class="btn btn-neo-primary btn-sm" id="compare-open-btn" disabled>Comparer</button>
  <button type="button" class="btn btn-neo-ghost btn-sm" id="compare-clear-btn">Effacer</button>
</div>

<!-- Compare modal -->
<div class="modal fade" id="compareModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content panel border-0">
      <div class="modal-header border-0">
        <h5 class="modal-title">Comparer les offres</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body pt-0" id="compare-modal-body"></div>
    </div>
  </div>
</div>

<!-- Create alert modal -->
<div class="modal fade" id="alertModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content panel border-0">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title"><i class="bi bi-bell-fill me-2"></i>Créer une alerte emploi</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body p-4">
        <p class="text-muted-soft small mb-3">Vous serez notifié dès qu'une nouvelle offre correspond à ces critères.</p>
        <div class="mb-3">
          <label class="form-label">Nom de l'alerte</label>
          <input type="text" class="form-control" id="alert-label">
        </div>
        <div class="p-3" style="border:1px solid var(--border-soft); border-radius:var(--radius-md);" id="alert-criteria-summary"></div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-neo-ghost btn-sm" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-neo-primary btn-sm px-4" id="alert-save-btn">Créer l'alerte</button>
      </div>
    </div>
  </div>
</div>

<footer id="site-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/notifications.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/pages/offres.js"></script>
</body>
</html>
