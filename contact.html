<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — NeoJob</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/theme.css" rel="stylesheet">
<script>try{if(localStorage.getItem("neojob_theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
</head>
<body>
<div class="bg-ambient"></div>

<header id="site-header"></header>

<main class="py-5">
  <div class="container">
    <div class="row justify-content-center text-center mb-5">
      <div class="col-lg-7">
        <h1 class="h3 mb-2">Une question ? Parlons-en</h1>
        <p class="text-muted-soft mb-0">Notre équipe vous répond généralement sous 24 à 48h ouvrées.</p>
      </div>
    </div>

    <div class="row g-4 justify-content-center">
      <div class="col-lg-7">
        <div class="panel p-4 p-md-5">
          <form id="contact-form" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nom complet</label>
                <input type="text" class="form-control" id="c-nom" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Adresse email</label>
                <input type="email" class="form-control" id="c-email" required>
              </div>
              <div class="col-12">
                <label class="form-label">Sujet</label>
                <select class="form-select" id="c-sujet">
                  <option>Question générale</option>
                  <option>Assistance candidat</option>
                  <option>Assistance recruteur</option>
                  <option>Signaler un problème</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">Message</label>
                <textarea class="form-control" id="c-message" rows="5" required placeholder="Comment pouvons-nous vous aider ?"></textarea>
              </div>
            </div>
            <button type="submit" class="btn btn-neo-primary mt-4">Envoyer le message</button>
          </form>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="panel p-4 mb-3">
          <div class="d-flex align-items-center gap-3 mb-1">
            <span class="pill pill-cyan"><i class="bi bi-envelope"></i></span>
            <div>
              <div class="fw-semibold small">Email</div>
              <div class="text-muted-soft small">support@neojob.com</div>
            </div>
          </div>
        </div>
        <div class="panel p-4 mb-3">
          <div class="d-flex align-items-center gap-3">
            <span class="pill pill-violet"><i class="bi bi-telephone"></i></span>
            <div>
              <div class="fw-semibold small">Téléphone</div>
              <div class="text-muted-soft small">+212 5 22 00 00 00</div>
            </div>
          </div>
        </div>
        <div class="panel p-4">
          <div class="d-flex align-items-center gap-3">
            <span class="pill pill-mint"><i class="bi bi-geo-alt"></i></span>
            <div>
              <div class="fw-semibold small">Bureau</div>
              <div class="text-muted-soft small">Casablanca, Maroc</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/notifications.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/pages/contact.js"></script>
</body>
</html>
