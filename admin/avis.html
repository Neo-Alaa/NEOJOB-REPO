<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modération des avis — NeoJob</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet">
<script>try{if(localStorage.getItem("neojob_theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
</head>
<body>
<div class="bg-ambient"></div>

<header id="site-header"></header>

<div class="d-flex">
  <aside id="site-sidebar" style="width:250px;" class="d-none d-lg-block flex-shrink-0"></aside>

  <main class="flex-grow-1 p-3 p-lg-5" style="min-width:0;">
    <button class="btn btn-neo-outline btn-sm d-lg-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
      <i class="bi bi-list me-1"></i> Menu
    </button>

    <div class="mb-4">
      <h1 class="h4 mb-1">Avis des employés</h1>
      <p class="text-muted-soft mb-0">Validez ou refusez les avis déposés sur les profils entreprises.</p>
    </div>

    <ul class="nav nav-pills gap-2 mb-3" id="status-tabs">
      <li class="nav-item"><button class="btn btn-neo-outline btn-sm active" data-status="en_attente">En attente</button></li>
      <li class="nav-item"><button class="btn btn-neo-outline btn-sm" data-status="publiee">Publiés</button></li>
      <li class="nav-item"><button class="btn btn-neo-outline btn-sm" data-status="rejetee">Rejetés</button></li>
      <li class="nav-item"><button class="btn btn-neo-outline btn-sm" data-status="">Tous</button></li>
    </ul>

    <div class="panel p-4">
      <div class="table-responsive">
        <table class="table table-neo mb-0">
          <thead><tr><th>Avis</th><th>Entreprise</th><th>Note</th><th>Date</th><th>Statut</th><th></th></tr></thead>
          <tbody id="reviews-body"></tbody>
        </table>
      </div>
      <div id="reviews-empty" style="display:none;"></div>
    </div>
  </main>
</div>

<!-- Review detail modal -->
<div class="modal fade" id="reviewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content panel border-0">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title" id="review-modal-title">Avis</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body p-4" id="review-modal-body"></div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-danger-soft btn-sm" data-status="rejetee">Refuser</button>
        <button type="button" class="btn btn-neo-primary btn-sm" data-status="publiee">Publier</button>
      </div>
    </div>
  </div>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" style="background:var(--bg-panel); width:260px;">
  <div class="offcanvas-header">
    <span class="fw-semibold">Menu</span>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fermer"></button>
  </div>
  <div class="offcanvas-body pt-0" id="site-sidebar-mobile"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/pages/admin-avis.js"></script>
</body>
</html>
