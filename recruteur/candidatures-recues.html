<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidatures reçues — NeoJob</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet">
<script>try{if(localStorage.getItem("neojob_theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
</head>
<body>
<div class="bg-ambient"></div>

<header id="site-header"></header>

<div class="d-flex">
  <aside id="site-sidebar" style="width:250px;" class="d-none d-lg-block flex-shrink-0"></aside>

  <main class="flex-grow-1 p-3 p-lg-5" style="min-width:0;">
    <button class="btn btn-neo-outline btn-sm d-lg-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
      <i class="bi bi-list me-1"></i> Menu
    </button>

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
      <div>
        <h1 class="h4 mb-1">Candidatures reçues</h1>
        <p class="text-muted-soft mb-0">Faites glisser une candidature (ou utilisez le menu ⋮) pour la faire progresser dans votre pipeline.</p>
      </div>
      <select id="job-filter" class="form-select form-select-sm" style="width:auto; min-width:220px;">
        <option value="">Toutes les offres</option>
      </select>
    </div>

    <div class="kanban-board" id="kanban-board"></div>
    <div id="applications-empty" style="display:none;"></div>
  </main>
</div>

<!-- Candidate detail modal -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content panel border-0">
      <div class="modal-header border-0 pb-0">
        <div class="d-flex align-items-center gap-2" id="detail-candidate-header">
          <h5 class="modal-title mb-0" id="detail-candidate-name">Candidat</h5>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body p-4">
        <div class="d-flex flex-wrap gap-2 mb-3" id="detail-meta"></div>
        <h6 class="small text-muted-soft text-uppercase mb-2">Lettre de motivation</h6>
        <p id="detail-message" class="text-secondary-soft"></p>
        <h6 class="small text-muted-soft text-uppercase mb-2">CV</h6>
        <p id="detail-cv" class="text-muted-soft small mb-0"></p>
        <div id="detail-interview-info"></div>

        <h6 class="small text-muted-soft text-uppercase mb-2 mt-4">Messages</h6>
        <div id="messages-thread" class="mb-2" style="max-height:220px; overflow-y:auto;"></div>
        <div class="input-group">
          <textarea class="form-control" id="message-input" rows="1" placeholder="Écrire un message au candidat..."></textarea>
          <button type="button" class="btn btn-neo-primary" id="message-send-btn"><i class="bi bi-send"></i></button>
        </div>
      </div>
      <div class="modal-footer border-0 pt-0 flex-wrap gap-2">
        <select id="detail-status-select" class="form-select form-select-sm" style="width:auto;"></select>
        <button type="button" class="btn btn-neo-outline btn-sm" id="detail-update-btn">Mettre à jour le statut</button>
        <button type="button" class="btn btn-neo-primary btn-sm" id="detail-schedule-btn"><i class="bi bi-calendar-plus me-1"></i>Planifier un entretien</button>
      </div>
    </div>
  </div>
</div>

<!-- Interview scheduling modal -->
<div class="modal fade" id="interviewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content panel border-0">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title">Planifier un entretien</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body p-4">
        <form id="interview-form">
          <div class="mb-3">
            <label class="form-label">Format</label>
            <select class="form-select" id="iv-mode">
              <option value="video">Vidéo (visioconférence)</option>
              <option value="presentiel">Présentiel</option>
              <option value="telephone">Téléphone</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Lieu / lien</label>
            <input type="text" class="form-control" id="iv-lieu" placeholder="Ex: Lien Google Meet, adresse du bureau...">
          </div>
          <label class="form-label">Créneaux proposés (1 à 3)</label>
          <div class="mb-2">
            <input type="datetime-local" class="form-control" id="iv-slot-1">
          </div>
          <div class="mb-2">
            <input type="datetime-local" class="form-control" id="iv-slot-2">
          </div>
          <div class="mb-2">
            <input type="datetime-local" class="form-control" id="iv-slot-3">
          </div>
        </form>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-neo-ghost btn-sm" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-neo-primary btn-sm px-4" id="interview-submit-btn">Envoyer les créneaux</button>
      </div>
    </div>
  </div>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" style="background:var(--bg-panel); width:260px;">
  <div class="offcanvas-header">
    <span class="fw-semibold">Menu</span>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fermer"></button>
  </div>
  <div class="offcanvas-body pt-0" id="site-sidebar-mobile"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/pages/recruteur-candidatures.js"></script>
</body>
</html>
