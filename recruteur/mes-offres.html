<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes offres — NeoJob</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet">
<script>try{if(localStorage.getItem("neojob_theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
</head>
<body>
<div class="bg-ambient"></div>

<header id="site-header"></header>

<div class="d-flex">
  <aside id="site-sidebar" style="width:250px;" class="d-none d-lg-block flex-shrink-0"></aside>

  <main class="flex-grow-1 p-3 p-lg-5" style="min-width:0;">
    <button class="btn btn-neo-outline btn-sm d-lg-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
      <i class="bi bi-list me-1"></i> Menu
    </button>

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
      <div>
        <h1 class="h4 mb-1">Mes offres</h1>
        <p class="text-muted-soft mb-0">Gérez toutes les offres publiées par votre entreprise.</p>
      </div>
      <a href="poster-offre.html" class="btn btn-neo-primary btn-sm"><i class="bi bi-plus-lg me-1"></i> Nouvelle offre</a>
    </div>

    <div class="panel p-4">
      <div class="table-responsive">
        <table class="table table-neo mb-0">
          <thead><tr><th>Offre</th><th>Ville</th><th>Contrat</th><th>Statut</th><th>Candidatures</th><th></th></tr></thead>
          <tbody id="jobs-body"></tbody>
        </table>
      </div>
      <div id="jobs-empty" style="display:none;"></div>
    </div>
  </main>
</div>

<!-- Job stats modal -->
<div class="modal fade" id="statsModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content panel border-0">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title"><i class="bi bi-bar-chart-line me-2"></i>Statistiques — <span id="stats-job-title"></span></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body p-4">
        <div class="row g-3 mb-4">
          <div class="col-4 text-center">
            <div class="text-muted-soft small mb-1">Vues</div>
            <div class="h4 mb-0" id="stats-vues">0</div>
          </div>
          <div class="col-4 text-center">
            <div class="text-muted-soft small mb-1">Candidatures</div>
            <div class="h4 mb-0" id="stats-candidatures">0</div>
          </div>
          <div class="col-4 text-center">
            <div class="text-muted-soft small mb-1">Taux de conversion</div>
            <div class="h4 mb-0" id="stats-taux">0%</div>
          </div>
        </div>
        <h6 class="small text-muted-soft text-uppercase mb-2">Répartition par étape du pipeline</h6>
        <div style="height:220px;">
          <canvas id="stats-funnel-chart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" style="background:var(--bg-panel); width:260px;">
  <div class="offcanvas-header">
    <span class="fw-semibold">Menu</span>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fermer"></button>
  </div>
  <div class="offcanvas-body pt-0" id="site-sidebar-mobile"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../assets/js/pages/recruteur-mes-offres.js"></script>
</body>
</html>
